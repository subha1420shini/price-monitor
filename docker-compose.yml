version: "3.9"

services:
  backend:
    build: ./backend
    container_name: pricewatch-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    image: python:3.12-slim
    container_name: pricewatch-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5500:5500"
    command: python3 -m http.server 5500
    restart: unless-stopped